name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install the Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the Compact compiler
        # Pinned rather than "latest": the toolchain has moved fast enough
        # that grabbing latest here silently broke CI once already, ahead
        # of the SDK packages this project depends on catching up to it.
        run: compact update 0.31.0

      - name: Compile the contract
        run: compact compile contracts/counter.compact managed/counter

      - name: Run tests
        run: npm test

      - name: Typecheck the frontend
        run: npm run typecheck

      - name: Build the frontend
        run: npm run build
